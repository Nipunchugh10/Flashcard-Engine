{% extends "auth_base.html" %}

{% block title %}Log in · {{ app_name }}{% endblock %}

{% block content %}

<div class="text-center mb-10">
  <a href="/login" class="inline-flex items-center gap-3 group">
    <span class="inline-block w-10 h-10 rounded-sm bg-ember-500 rotate-[-4deg] shadow-paper group-hover:rotate-0 transition-transform"></span>
    <span class="font-display text-3xl font-semibold tracking-tight">{{ app_name }}</span>
  </a>
  <p class="mt-3 text-ink-500 text-sm">Welcome back. Sign in to your account.</p>
</div>

{% if error %}
<div class="mb-6 rounded-lg border border-rose-500/30 bg-rose-500/5 px-4 py-3 text-sm text-rose-600">
  {{ error }}
</div>
{% endif %}

<form method="POST" action="/login" class="space-y-5">

  <div>
    <label for="email" class="block text-sm font-medium text-ink-700 mb-1.5">Email address</label>
    <input
      type="email"
      id="email"
      name="email"
      required
      autocomplete="email"
      placeholder="you@example.com"
      class="w-full px-4 py-3 bg-paper-100 border border-paper-300 rounded-xl focus:outline-none focus:border-ember-500 focus:ring-2 focus:ring-ember-500/20 transition placeholder:text-ink-400" />
  </div>

  <div>
    <label for="password" class="block text-sm font-medium text-ink-700 mb-1.5">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      required
      autocomplete="current-password"
      placeholder="••••••••"
      class="w-full px-4 py-3 bg-paper-100 border border-paper-300 rounded-xl focus:outline-none focus:border-ember-500 focus:ring-2 focus:ring-ember-500/20 transition placeholder:text-ink-400" />
  </div>

  <button
    type="submit"
    class="w-full py-3 rounded-full bg-ink-900 text-paper-50 font-semibold text-base hover:bg-ember-600 transition-colors shadow-paper">
    Sign in
  </button>

</form>

<div class="mt-8 text-center">
  <p class="text-sm text-ink-500">
    Don't have an account?
    <a href="/signup" class="text-ember-600 font-medium hover:underline">Create one</a>
  </p>
</div>

{% endblock %}

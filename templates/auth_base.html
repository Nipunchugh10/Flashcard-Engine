<!DOCTYPE html>
<html lang="en">
<head>
  {% include "components/head.html" %}
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  {% block head %}{% endblock %}
</head>
<body class="font-sans text-ink-900 bg-paper-50 antialiased min-h-screen flex items-center justify-center">
  <div class="page-grain"></div>

  <main class="relative z-10 w-full max-w-md mx-auto px-6 py-12">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
